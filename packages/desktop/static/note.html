<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>便签</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #333333;
        --muted: #8a8a8a;
        --border: #e5e5e5;
        --bar: #f7f7f7;
        --accent: #21b56f;
      }
      :root[data-style='sticky'] {
        --bg: #fffbe6;
        --fg: #3b3a36;
        --muted: #8a8270;
        --border: #efe4b8;
        --bar: #fff7d6;
        --accent: #d8a300;
      }
      :root[data-style='dark'] {
        --bg: #1f1f1f;
        --fg: #e6e6e6;
        --muted: #9a9a9a;
        --border: #333333;
        --bar: #262626;
        --accent: #2bc37a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        flex: 0 0 34px;
        height: 34px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
      }
      header input {
        -webkit-app-region: no-drag;
        border: 1px solid transparent;
        background: transparent;
        color: inherit;
        font-family: inherit;
        border-radius: 4px;
        outline: none;
        padding: 2px 4px;
        user-select: text;
      }
      header input:hover,
      header input:focus {
        border-color: var(--border);
        background: var(--bg);
      }
      #name {
        flex: 1;
        min-width: 60px;
        font-size: 12px;
        font-weight: 600;
      }
      #tag {
        width: 92px;
        font-size: 12px;
        color: var(--accent);
      }
      header button {
        -webkit-app-region: no-drag;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        padding: 0;
      }
      header button:hover {
        background: var(--border);
        color: var(--fg);
      }
      header button[aria-pressed='true'] {
        color: var(--accent);
      }
      #note {
        flex: 1;
        width: 100%;
        padding: 12px 14px;
        border: none;
        outline: none;
        resize: none;
        background: transparent;
        color: inherit;
        font-size: 15px;
        line-height: 1.75;
        font-family: inherit;
        user-select: text;
      }
      #note::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }
      footer {
        flex: 0 0 34px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
        border-top: 1px solid var(--border);
        background: var(--bar);
      }
      footer .hint {
        flex: 1;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      footer button {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        border-radius: 5px;
        font-size: 12px;
        padding: 3px 10px;
        cursor: pointer;
        white-space: nowrap;
        font-family: inherit;
      }
      footer button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <input id="name" title="便签名称" />
      <input id="tag" title="绑定标签，插入时放在正文前，例如 #会议" placeholder="#标签" />
      <button id="pin" type="button" aria-pressed="true" title="固定在最前面">📌</button>
      <button id="style" type="button" title="切换样式">🎨</button>
      <button id="close" type="button" title="仅保存并关闭">✕</button>
    </header>
    <textarea id="note" placeholder="随手记点什么。点「插入」把内容送回文档，关闭只保存。"></textarea>
    <footer>
      <span class="hint" id="hint"></span>
      <button id="delete" type="button" title="删除这张便签">删除</button>
      <button id="insert" type="button" class="primary">插入到文档</button>
    </footer>

    <script>
      const params = new URLSearchParams(location.search)
      const noteId = params.get('id') || ''
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light'

      const nameInput = document.getElementById('name')
      const tagInput = document.getElementById('tag')
      const note = document.getElementById('note')
      const pinButton = document.getElementById('pin')
      const styleButton = document.getElementById('style')
      const hint = document.getElementById('hint')

      const send = (channel, ...args) => window.electron.ipcRenderer.send(channel, ...args)

      const STYLES = ['follow', 'sticky', 'dark']
      const LABELS = { follow: '跟随主题', sticky: '便签纸', dark: '深色' }
      let style = localStorage.getItem('mt-note-style') || 'follow'
      if (!STYLES.includes(style)) style = 'follow'
      const applyStyle = () => {
        document.documentElement.dataset.style = style === 'follow' ? theme : style
        styleButton.title = '样式：' + LABELS[style] + '（点击切换）'
        localStorage.setItem('mt-note-style', style)
      }
      applyStyle()
      styleButton.addEventListener('click', () => {
        style = STYLES[(STYLES.indexOf(style) + 1) % STYLES.length]
        applyStyle()
      })

      let saveTimer = null
      const scheduleSave = () => {
        clearTimeout(saveTimer)
        saveTimer = setTimeout(() => {
          send('mt::note::draft', noteId, note.value)
          send('mt::note::update', noteId, { name: nameInput.value, tag: tagInput.value })
          hint.textContent = '已保存 ' + new Date().toLocaleTimeString()
        }, 250)
      }

      note.addEventListener('input', scheduleSave)
      nameInput.addEventListener('input', scheduleSave)
      tagInput.addEventListener('input', scheduleSave)

      const submit = () => {
        clearTimeout(saveTimer)
        send('mt::note::draft', noteId, note.value)
        send('mt::note::update', noteId, { name: nameInput.value, tag: tagInput.value })
        send('mt::note::submit', noteId)
      }
      const close = () => {
        clearTimeout(saveTimer)
        send('mt::note::draft', noteId, note.value)
        send('mt::note::update', noteId, { name: nameInput.value, tag: tagInput.value })
        send('mt::note::close', noteId)
      }
      const remove = () => {
        if (!confirm('删除这张便签？内容不会插入文档。')) return
        send('mt::note::delete', noteId)
      }

      document.getElementById('insert').addEventListener('click', submit)
      document.getElementById('close').addEventListener('click', close)
      document.getElementById('delete').addEventListener('click', remove)

      pinButton.addEventListener('click', async () => {
        const pinned = await window.electron.ipcRenderer.invoke('mt::note::toggle-pin', noteId)
        pinButton.setAttribute('aria-pressed', String(!!pinned))
      })

      note.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault()
          submit()
        } else if (event.key === 'Escape') {
          event.preventDefault()
          close()
        }
      })

      const boot = async () => {
        const record = await window.electron.ipcRenderer.invoke('mt::note::get', noteId)
        if (!record) {
          hint.textContent = '便签不存在'
          return
        }
        nameInput.value = record.name || '便签'
        tagInput.value = record.tag || ''
        note.value = record.content || ''
        document.title = record.name || '便签'
        pinButton.setAttribute('aria-pressed', String(!!record.pinned))
        hint.textContent = 'Ctrl+Enter 插入 · Esc 保存并关闭'
        note.focus()
      }
      boot()
    </script>
  </body>
</html>
