<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>便签</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #333333;
        --muted: #8a8a8a;
        --border: #e5e5e5;
        --bar: #f7f7f7;
        --accent: #21b56f;
      }
      :root[data-style='sticky'] {
        --bg: #fffbe6;
        --fg: #3b3a36;
        --muted: #8a8270;
        --border: #efe4b8;
        --bar: #fff7d6;
        --accent: #d8a300;
      }
      :root[data-style='dark'] {
        --bg: #1f1f1f;
        --fg: #e6e6e6;
        --muted: #9a9a9a;
        --border: #333333;
        --bar: #262626;
        --accent: #2bc37a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        height: 34px;
        flex: 0 0 34px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px 0 12px;
        background: var(--bar);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
      }
      header .title {
        flex: 1;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.5px;
      }
      header button {
        -webkit-app-region: no-drag;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
        padding: 0;
      }
      header button:hover {
        background: var(--border);
        color: var(--fg);
      }
      header button[aria-pressed='true'] {
        color: var(--accent);
      }
      #note {
        flex: 1;
        width: 100%;
        padding: 12px 14px;
        border: none;
        outline: none;
        resize: none;
        background: transparent;
        color: inherit;
        font-size: 15px;
        line-height: 1.75;
        font-family: inherit;
        user-select: text;
      }
      #note::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">便签</span>
      <button id="style" type="button" title="切换样式">🎨</button>
      <button id="pin" type="button" aria-pressed="true" title="固定在最前面">📌</button>
      <button id="close" type="button" title="插入并关闭">✕</button>
    </header>
    <textarea id="note" placeholder="随手记点什么，关闭时内容会插入到文档光标处…"></textarea>

    <script>
      const note = document.getElementById('note')
      const pinButton = document.getElementById('pin')
      const styleButton = document.getElementById('style')
      const send = (channel, ...args) => window.electron.ipcRenderer.send(channel, ...args)

      const params = new URLSearchParams(location.search)
      const theme = params.get('theme') === 'dark' ? 'dark' : 'light'
      const STYLES = ['follow', 'sticky', 'dark']
      const STYLE_LABELS = { follow: '跟随主题', sticky: '便签纸', dark: '深色' }

      const applyStyle = (style) => {
        const resolved = style === 'follow' ? theme : style
        document.documentElement.dataset.style = resolved
        styleButton.title = '样式：' + STYLE_LABELS[style] + '（点击切换）'
        localStorage.setItem('mt-note-style', style)
      }

      let style = localStorage.getItem('mt-note-style') || 'follow'
      if (!STYLES.includes(style)) style = 'follow'
      applyStyle(style)

      styleButton.addEventListener('click', () => {
        style = STYLES[(STYLES.indexOf(style) + 1) % STYLES.length]
        applyStyle(style)
      })

      let draftTimer = null
      note.addEventListener('input', () => {
        clearTimeout(draftTimer)
        draftTimer = setTimeout(() => send('mt::note::draft', note.value), 200)
      })

      const submit = () => {
        clearTimeout(draftTimer)
        send('mt::note::submit', note.value)
      }
      const cancel = () => {
        clearTimeout(draftTimer)
        send('mt::note::cancel')
      }

      pinButton.addEventListener('click', async () => {
        const isPinned = await window.electron.ipcRenderer.invoke('mt::note::toggle-pin')
        pinButton.setAttribute('aria-pressed', String(!!isPinned))
        pinButton.title = isPinned ? '已固定在最前面' : '未固定'
      })

      document.getElementById('close').addEventListener('click', submit)

      note.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault()
          cancel()
        } else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
          event.preventDefault()
          submit()
        }
      })

      window.electron.ipcRenderer
        .invoke('mt::note::is-pinned')
        .then((isPinned) => {
          pinButton.setAttribute('aria-pressed', String(!!isPinned))
          pinButton.title = isPinned ? '已固定在最前面' : '未固定'
        })
        .catch(() => {})

      note.focus()
    </script>
  </body>
</html>
